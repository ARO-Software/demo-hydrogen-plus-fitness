/* ---------- Final-touch layer: intro, reveals, tapes, header, menu ---------- */

/* Intro: the heartbeat draws, then the three columns of the hero lift away. */
#intro{display:none}
html.intro #intro{display:block;position:fixed;inset:0;z-index:200;cursor:pointer;animation:introSafety 0s 6s forwards}
@keyframes introSafety{to{visibility:hidden;opacity:0;pointer-events:none}}
.intro-cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.intro-cols i{position:relative;background:#0A0A0B;box-shadow:1px 0 0 #0A0A0B}
.intro-cols i::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:#FF2A33;box-shadow:0 0 22px 5px rgba(255,42,51,.65);opacity:0}
.intro-core{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;font-family:Anton,Impact,sans-serif;color:#FFFFFF}
.intro-core::before{content:"";position:absolute;left:50%;top:50%;width:70vmin;height:70vmin;margin:-35vmin 0 0 -35vmin;border-radius:50%;background:radial-gradient(closest-side,rgba(227,18,27,.35),rgba(227,18,27,0));opacity:0}
.intro-mark{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;opacity:0}
.intro-word{font-size:clamp(44px,7vw,92px);line-height:1;letter-spacing:.04em}
.intro-word b{font-weight:400;color:#FF3B42}
.intro-sub{font-family:Inter,system-ui,sans-serif;font-size:11px;font-weight:700;letter-spacing:.42em;color:#A1A1AA;padding-left:.42em}
.intro-ecg{position:relative;width:100vw;height:110px;overflow:visible}
.intro-ecg path{fill:none;stroke:#FF2A33;stroke-width:3;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 6px rgba(255,42,51,.8))}
#intro.go .intro-ecg path{animation:introDraw .95s linear .1s forwards}
#intro.go .intro-mark{animation:introBeat .8s cubic-bezier(.2,.8,.3,1) .5s both}
#intro.go .intro-core::before{animation:introGlow .8s ease-out .5s both}
#intro.go .intro-core{animation:introCoreOut .35s cubic-bezier(.7,0,.84,0) 1.2s forwards}
#intro.go .intro-cols i{animation:introLift .95s cubic-bezier(.76,0,.24,1) 1.35s forwards}
#intro.go .intro-cols i:nth-child(2){animation-delay:1.43s}
#intro.go .intro-cols i:nth-child(3){animation-delay:1.51s}
#intro.go .intro-cols i::after{animation:introEdge .95s linear 1.35s forwards}
#intro.go .intro-cols i:nth-child(2)::after{animation-delay:1.43s}
#intro.go .intro-cols i:nth-child(3)::after{animation-delay:1.51s}
#intro.done{opacity:0;transition:opacity .35s ease;pointer-events:none}
@keyframes introDraw{to{stroke-dashoffset:0}}
@keyframes introBeat{0%{opacity:0;transform:scale(.86)}22%{opacity:1;transform:scale(1.07)}40%{transform:scale(.98)}56%{transform:scale(1.035)}100%{opacity:1;transform:scale(1)}}
@keyframes introGlow{0%{opacity:0;transform:scale(.6)}22%{opacity:1;transform:scale(1)}56%{opacity:.8;transform:scale(1.1)}100%{opacity:.35;transform:scale(1)}}
@keyframes introCoreOut{to{opacity:0;transform:translateY(-36px)}}
@keyframes introLift{to{transform:translateY(-101%)}}
@keyframes introEdge{0%{opacity:0}8%{opacity:1}85%{opacity:1}100%{opacity:0}}

/* Headline words rise out of a mask. */
.motion .split .w{display:inline-block;overflow:hidden;vertical-align:top;padding:.1em .02em .06em;margin:-.1em -.02em -.06em}
.motion .split .w>span{display:inline-block;transform:translateY(112%);transition:transform 1.05s cubic-bezier(.16,1,.3,1);transition-delay:calc(var(--i,0) * 70ms + var(--d,0ms))}
.motion .split.in .w>span{transform:none}

/* Hero copy enters after the intro. */
.motion [data-hero]{opacity:0;transform:translateY(22px);transition:opacity .9s ease,transform 1.1s cubic-bezier(.16,1,.3,1);transition-delay:var(--d,0ms)}
.motion.hero-in [data-hero]{opacity:1;transform:none}

/* Scroll reveals: single blocks, staggered groups, media curtains. */
.motion [data-reveal]{opacity:0;transform:translateY(28px);transition:opacity .9s ease,transform 1.1s cubic-bezier(.16,1,.3,1);transition-delay:var(--d,0ms)}
.motion [data-reveal].in{opacity:1;transform:none}
.motion [data-stagger]>*{opacity:0;transform:translateY(34px);transition:opacity .8s ease,transform 1.1s cubic-bezier(.16,1,.3,1);transition-delay:calc(var(--i,0) * 85ms)}
.motion [data-stagger="x"]>*{transform:translateX(120px)}
.motion [data-stagger].in>*{opacity:1;transform:none}
.motion [data-curtain]::after{content:"";position:absolute;inset:-1px;z-index:5;background:#0A0A0B;transform-origin:50% 0;transition:transform 1.25s cubic-bezier(.76,0,.24,1);transition-delay:inherit;pointer-events:none}
.motion [data-curtain].in::after{transform:scaleY(0)}
.motion [data-curtain]>img,.motion [data-curtain]>video{transform:scale(1.18);transition:transform 1.8s cubic-bezier(.16,1,.3,1)}
.motion [data-curtain].in>img,.motion [data-curtain].in>video{transform:none}

/* Crossed marquee tapes. JS moves them and lets scroll speed push them along. */
.tapes{position:relative;height:clamp(150px,13vw,260px);overflow:hidden;background:#0A0A0B}
.tape{position:absolute;left:-6%;width:112%;top:50%;overflow:hidden}
.tape-a{z-index:2;background:#E3121B;border-top:1px solid #FF3B42;border-bottom:1px solid #A80C13;transform:translateY(-50%) rotate(-3deg);box-shadow:0 24px 50px rgba(0,0,0,.55)}
.tape-b{background:#17171A;border-top:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1);transform:translateY(-50%) rotate(2.4deg)}
.tape-track{display:flex;width:max-content;padding:16px 0;font-family:Anton,Impact,sans-serif;font-size:30px;line-height:1.15;letter-spacing:.06em;white-space:nowrap;color:#FFFFFF;will-change:transform}
.tape-track span{padding-right:48px}
.tape-b .tape-track{color:#D4D4D8}
.tape-b .tape-track em{font-style:normal;color:#FF3B42}
@media (max-width:860px){.tapes{height:170px}.tape-track{font-size:22px;padding:13px 0}.tape-a{top:60%;transform:translateY(-50%) rotate(-4deg)}.tape-b{top:38%;transform:translateY(-50%) rotate(3.5deg)}}

/* Header: deeper once scrolled, reading-progress line, section indicator. */
#hdr{transition:background .35s ease,box-shadow .35s ease}
#hdr.scrolled{background:rgba(10,10,11,.95) !important;box-shadow:0 12px 32px rgba(0,0,0,.4)}
.hprog{position:absolute;left:0;right:0;bottom:-1px;height:2px;pointer-events:none}
.hprog i{display:block;height:100%;background:#FF2A33;box-shadow:0 0 10px rgba(255,42,51,.8);transform-origin:0 50%;transform:scaleX(0)}

.navlink{transition:color .25s ease}
.navlink.is-active{color:#FFFFFF}
.nav-ind{position:absolute;left:0;bottom:-7px;height:2px;width:0;border-radius:2px;background:#FF2A33;opacity:0;transition:transform .55s cubic-bezier(.16,1,.3,1),width .55s cubic-bezier(.16,1,.3,1),opacity .3s ease}

/* Buttons: a light sweep on hover, magnetic pull on big calls to action. */
.btn-red{position:relative;overflow:hidden;isolation:isolate}
.btn-red::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.32) 50%,transparent 70%);transform:translateX(-120%);transition:transform .75s cubic-bezier(.16,1,.3,1)}
.btn-red:hover::after{transform:translateX(120%)}
.mag{transition:transform .45s cubic-bezier(.16,1,.3,1),background .2s ease}
.beat{position:relative}
.beat::before{content:"";position:absolute;inset:0;border-radius:inherit;animation:beatRing 1.8s ease-out infinite;pointer-events:none}
@keyframes beatRing{0%{box-shadow:0 0 0 0 rgba(10,10,11,.55)}30%{box-shadow:0 0 0 14px rgba(10,10,11,0)}31%{box-shadow:0 0 0 0 rgba(10,10,11,.4)}60%{box-shadow:0 0 0 22px rgba(10,10,11,0)}100%{box-shadow:0 0 0 22px rgba(10,10,11,0)}}

/* Services stripe: drag on desktop, position line underneath. */
.svc-track.dragging{cursor:grabbing;scroll-snap-type:none !important;scroll-behavior:auto}
.svc-track.dragging .svc-card{pointer-events:none}
@media (hover:hover) and (pointer:fine){.svc-track{cursor:grab}}
.svc-prog{position:relative;height:2px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.svc-prog i{position:absolute;left:0;top:0;bottom:0;width:30%;border-radius:2px;background:#FF2A33}
.svc-track.dragging{user-select:none;-webkit-user-select:none}

/* Coach and day switches answer the tap. */
.is-swap [data-sw="photo"]{animation:swPhoto .85s cubic-bezier(.76,0,.24,1) both}
.is-swap [data-sw="photo"]>img{animation:swZoom 1.4s cubic-bezier(.16,1,.3,1) both}
.is-swap [data-sw="up"]{animation:swUp .75s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0) * 55ms + 120ms)}
.is-swap [data-sw="bar"]{transform-origin:0 50%;animation:swBar 1.1s cubic-bezier(.16,1,.3,1) .3s both}
@keyframes swPhoto{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes swZoom{from{transform:scale(1.16)}to{transform:none}}
@keyframes swUp{from{filter:opacity(0);transform:translateY(18px)}to{filter:none;transform:none}}
@keyframes swBar{from{transform:scaleX(0)}to{transform:none}}

/* Phone menu: red columns drop in, links rise. */
.burger{display:none;width:44px;height:44px;flex:0 0 auto;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:transparent;color:#FFFFFF;cursor:pointer;align-items:center;justify-content:center;padding:0}
.burger i{position:absolute;width:16px;height:2px;border-radius:2px;background:currentColor;transition:transform .45s cubic-bezier(.76,0,.24,1)}
.burger i:first-child{transform:translateY(-3.5px)}
.burger i:last-child{transform:translateY(3.5px)}
.menu-open .burger i:first-child{transform:rotate(45deg)}
.menu-open .burger i:last-child{transform:rotate(-45deg)}
.mmenu{position:fixed;inset:0;z-index:45;visibility:hidden;transition:visibility 0s linear .9s}
.menu-open .mmenu{visibility:visible;transition:none}
.mm-cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.mm-cols i{background:#E3121B;box-shadow:1px 0 0 #E3121B;transform:translateY(-101%);transition:transform .7s cubic-bezier(.76,0,.24,1)}
.mm-cols i:nth-child(2){transition-delay:.06s}
.mm-cols i:nth-child(3){transition-delay:.12s}
.menu-open .mm-cols i{transform:none}
.mm-body{position:relative;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:104px 24px 32px}
.mm-nav{display:flex;flex-direction:column}
.mm-nav a{display:block;overflow:hidden;font-family:Anton,Impact,sans-serif;font-size:clamp(44px,13vw,72px);line-height:1.08;text-transform:uppercase;color:#FFFFFF;text-decoration:none}
.mm-nav a span{display:block;transform:translateY(110%);transition:transform .7s cubic-bezier(.16,1,.3,1)}
.menu-open .mm-nav a span{transform:none;transition-delay:calc(.32s + var(--i,0) * 55ms)}
.mm-foot{display:flex;flex-wrap:wrap;gap:10px;opacity:0;transition:opacity .4s ease}
.menu-open .mm-foot{opacity:1;transition-delay:.6s}
.mm-foot a{display:inline-flex;align-items:center;min-height:48px;padding:0 20px;border-radius:999px;background:#0A0A0B;color:#FFFFFF;text-decoration:none;font-weight:800;font-size:14px;letter-spacing:.04em}
.menu-open .mbar{opacity:0;pointer-events:none}
.mbar{transition:opacity .3s ease}
@media (max-width:860px){.burger{display:inline-flex;position:relative}.hdr-in{gap:12px !important}}
@media (max-width:480px){.hdr-join{display:none !important}}

/* Footer wordmark. */
.bigmark{display:inline-block;font-family:Anton,Impact,sans-serif;font-size:19vw;line-height:.8;letter-spacing:.01em;white-space:nowrap;text-align:center;user-select:none;padding-top:.06em}
.bigmark .w>span{background:linear-gradient(180deg,#FF2A33 0%,#E3121B 35%,rgba(227,18,27,.08) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.motion .bigmark .w>span{transition-duration:1.2s;transition-delay:calc(var(--i,0) * 55ms)}

@media (prefers-reduced-motion:reduce){.is-swap [data-sw]{animation:none !important}.mm-cols i,.mm-nav a span,.mag{transition:none !important}}
</style>

<script>

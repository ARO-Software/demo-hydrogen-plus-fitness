<style>
body{margin:0;background:#0A0A0B}
a{color:#FF3B42}a:hover{color:#FF7076}
*{box-sizing:border-box}
.ecg path{stroke-dasharray:1600;stroke-dashoffset:1600;animation:ecg 3.2s cubic-bezier(.6,0,.3,1) infinite}
@keyframes ecg{0%{stroke-dashoffset:1600}55%{stroke-dashoffset:0}100%{stroke-dashoffset:-1600}}
.mq{animation:mq 38s linear infinite}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.kb{animation:kb 22s ease-in-out infinite alternate;transform-origin:50% 45%;will-change:transform;backface-visibility:hidden}
.svc-track{scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.svc-track::-webkit-scrollbar{display:none}
.svc-card video{transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.svc-card:hover video{transform:scale(1.05)}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.12)}}
.scan{animation:scan 5s linear infinite}
@keyframes scan{0%{top:-2%;opacity:0}8%{opacity:1}92%{opacity:1}100%{top:102%;opacity:0}}
html{scroll-behavior:smooth}
section[id]{scroll-margin-top:72px}
a:focus-visible,button:focus-visible{outline:2px solid #FF3B42;outline-offset:3px}
.mbar{display:none}
.navlink{color:#D6D6D8;text-decoration:none}
.navlink:hover{color:#FFFFFF}
.btn-red:hover{background:#FF2A33 !important}
.btn-ghost:hover{background:rgba(255,255,255,.08) !important}
.daybtn:hover{border-color:#FF3B42 !important}
.outline{color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.22)}
@media (max-width:860px){.navlinks{display:none !important}.hide-sm{display:none !important}.mbar{display:grid}.mpad{padding-bottom:96px !important}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.kb,.mq,.pulse,.scan,.ecg path{animation:none !important}.ecg path{stroke-dashoffset:0}}
</style>

</head>
